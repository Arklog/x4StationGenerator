name: PR Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: linux
          version: "6.9.0"
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build --target x4StationGenerator_tests --config Debug

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Debug
